# configs/config.yaml
defaults:
  - _self_
  - app: train_dinov3 # merge/extend on top of app: default

diy_name: "_ad2_smoke"

# train / AD
mode: train

data:
  batch_size: 4
  num_workers: 0
  pin_mem: true
  dataset: mvtec_ad2
  data_name: mvtec_ad2_all_alltrain
  data_path: /Data02/peiyuxuan
  train_root: ${data.data_path}/mvtec_ad_2
  test_root: ${data.data_path}/mvtec_ad_2
  classnames:
    - can
    - fabric
    - fruit_jelly
    - rice
    - sheet_metal
    - vial
    - wallplugs
    - walnuts

  use_hflip: false
  use_vflip: false
  use_rotate90: false
  use_color_jitter: false
  use_gray: false
  use_blur: false

optimization:
  weight_decay: 1e-4
  epochs: 3
  lr: 0.001
  lr_config: const # const, cosine, step, cosine_warmup
  min_lr: 1e-4 # for cosine and cosine_warmup
  warmup_epoch: 100 # cosine_warmup
  step_size: 300 # step
  gamma: 0.1 # step
  
  

testing:
  K_top_mvtec: 10    
  K_top_visa: 6         
  expect_fpr: 0.3     
  max_steps: 200      
  segmentation_vis: True

devices: [cuda:0]

dist:
  master_addr: localhost
  master_port: 40112
  backend: nccl

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
